name: Physical reality failure
description: I would not actually build it like this.
title: "[physical] "
labels: ["physical-reality"]
body:
  - type: textarea
    id: area
    attributes:
      label: Component / area
      placeholder: Kitchen drain under the joists, bath wet wall, HVAC trunk…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: showed
    attributes:
      label: What Clove showed
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it appears wrong
    validations:
      required: true
  - type: input
    id: trade
    attributes:
      label: Trade / background (optional)
  - type: markdown
    attributes:
      value: Attach a screenshot if you can.
